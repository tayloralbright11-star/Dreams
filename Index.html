<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sacred Daily · Silvana</title>
<style>
body{font-family:Georgia,serif;margin:0;background:#fdf5f0;color:#3d1520}.wrap{max-width:900px;margin:0 auto;padding:16px}.tabs{display:flex;gap:8px;position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid #ddd}.tabs button{padding:8px 10px}.tab{display:none}.tab.active{display:block}.card{background:#fff;border:1px solid #e7d4dc;padding:12px;margin:10px 0}.row{display:flex;gap:8px}.row input{flex:1}.item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1e6eb}.item:last-child{border-bottom:none}.grow{flex:1}.muted{color:#7a4055;font-size:12px}.btn{cursor:pointer}.small{font-size:12px}
</style>
</head>
<body>
<div class="tabs">
  <button onclick="switchTab('today')">Today</button>
  <button onclick="switchTab('projects')">Projects</button>
  <button onclick="switchTab('finance')">Finance</button>
</div>
<div class="wrap">
  <section id="today" class="tab active">
    <div class="card"><h3>Daily Tasks</h3>
      <div id="daily-list"></div>
      <div class="row"><input id="daily-input" placeholder="Add daily task for today"/><button class="btn" onclick="addDaily()">Add</button></div>
    </div>
  </section>

  <section id="projects" class="tab">
    <div class="card"><h3>Big Projects</h3>
      <div id="projects-list"></div>
      <div class="row"><input id="project-input" placeholder="New project name"/><button class="btn" onclick="addProject()">Add Project</button></div>
    </div>
  </section>

  <section id="finance" class="tab">
    <div class="card"><h3>Finance Actions</h3>
      <div id="finance-list"></div>
      <div class="row"><input id="finance-input" placeholder="Add finance action"/><button class="btn" onclick="addFinance()">Add</button></div>
    </div>
    <div class="card"><h3>Bills</h3>
      <div id="bills-list"></div>
      <div class="row"><input id="bill-name" placeholder="Bill name"/><input id="bill-amt" placeholder="$ amount"/><button onclick="addBill()">Add Bill</button></div>
    </div>
  </section>
</div>

<script>
const SK='sacred_daily_full_v1';
let state={};
const defaults={
  daily:[{text:'Drink water',done:false},{text:'Take meds',done:false}],
  projects:[{id:crypto.randomUUID(),name:"Sage's Room Reset",tasks:[{id:crypto.randomUUID(),text:'Trash sweep',done:false}]}],
  finance:[{text:'Call disability lawyer',done:false}],
  bills:[{name:'Rent / Housing',amt:'$___',paid:false}]
};
function save(){localStorage.setItem(SK,JSON.stringify(state));}
function load(){try{state=JSON.parse(localStorage.getItem(SK)||'{}')}catch{state={}}; state.daily ||= structuredClone(defaults.daily); state.projects ||= structuredClone(defaults.projects); state.finance ||= structuredClone(defaults.finance); state.bills ||= structuredClone(defaults.bills); save();}
function switchTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');}
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

function renderDaily(){const c=document.getElementById('daily-list'); c.innerHTML=''; state.daily.forEach((t,i)=>{const n=el(`<div class='item'><input type='checkbox' ${t.done?'checked':''}><div class='grow'></div><button class='small'>Edit</button><button class='small'>Delete</button></div>`);n.querySelector('input').onchange=e=>{t.done=e.target.checked;save();}; n.querySelector('.grow').textContent=t.text; const [e,d]=n.querySelectorAll('button'); e.onclick=()=>{const v=prompt('Edit daily task',t.text); if(v===null) return; if(!v.trim()) return; t.text=v.trim(); save(); renderDaily();}; d.onclick=()=>{state.daily.splice(i,1); save(); renderDaily();}; c.appendChild(n);});}
function addDaily(){const i=document.getElementById('daily-input'); const v=i.value.trim(); if(!v) return; state.daily.push({text:v,done:false}); i.value=''; save(); renderDaily();}

function renderProjects(){const c=document.getElementById('projects-list'); c.innerHTML=''; state.projects.forEach((p,pi)=>{const card=el(`<div class='card'><div class='row'><strong class='grow'></strong><button class='small'>Rename</button><button class='small'>Delete</button></div><div class='muted'></div><div class='tasks'></div><div class='row'><input placeholder='Add task to project'><button>Add task</button></div></div>`); card.querySelector('strong').textContent=p.name; const done=p.tasks.filter(t=>t.done).length; card.querySelector('.muted').textContent=`${done}/${p.tasks.length} complete`; const [rename,del]=card.querySelectorAll('.row button'); rename.onclick=()=>{const v=prompt('Rename project',p.name); if(v&&v.trim()){p.name=v.trim();save();renderProjects();}}; del.onclick=()=>{state.projects.splice(pi,1);save();renderProjects();}; const tasks=card.querySelector('.tasks'); p.tasks.forEach((t,ti)=>{const n=el(`<div class='item'><input type='checkbox' ${t.done?'checked':''}><div class='grow'></div><button class='small'>Edit</button><button class='small'>Delete</button></div>`); n.querySelector('input').onchange=e=>{t.done=e.target.checked;save();renderProjects();}; n.querySelector('.grow').textContent=t.text; const [e,d]=n.querySelectorAll('button'); e.onclick=()=>{const v=prompt('Edit project task',t.text); if(v&&v.trim()){t.text=v.trim();save();renderProjects();}}; d.onclick=()=>{p.tasks.splice(ti,1);save();renderProjects();}; tasks.appendChild(n);}); const inp=card.querySelector('input'); card.querySelector('.row:last-child button').onclick=()=>{const v=inp.value.trim(); if(!v) return; p.tasks.push({id:crypto.randomUUID(),text:v,done:false}); inp.value=''; save(); renderProjects();}; c.appendChild(card);});}
function addProject(){const i=document.getElementById('project-input'); const v=i.value.trim(); if(!v) return; state.projects.push({id:crypto.randomUUID(),name:v,tasks:[]}); i.value=''; save(); renderProjects();}

function renderFinance(){const c=document.getElementById('finance-list'); c.innerHTML=''; state.finance.forEach((t,i)=>{const n=el(`<div class='item'><input type='checkbox' ${t.done?'checked':''}><div class='grow'></div><button class='small'>Edit</button><button class='small'>Delete</button></div>`);n.querySelector('input').onchange=e=>{t.done=e.target.checked;save();}; n.querySelector('.grow').textContent=t.text; const [e,d]=n.querySelectorAll('button'); e.onclick=()=>{const v=prompt('Edit finance task',t.text); if(v&&v.trim()){t.text=v.trim();save();renderFinance();}}; d.onclick=()=>{state.finance.splice(i,1);save();renderFinance();}; c.appendChild(n);});
const b=document.getElementById('bills-list'); b.innerHTML=''; state.bills.forEach((x,i)=>{const n=el(`<div class='item'><input type='checkbox' ${x.paid?'checked':''}><div class='grow'></div><button class='small'>Edit</button><button class='small'>Delete</button></div>`); n.querySelector('.grow').textContent=`${x.name} · ${x.amt}`; n.querySelector('input').onchange=e=>{x.paid=e.target.checked;save();}; const [e,d]=n.querySelectorAll('button'); e.onclick=()=>{const name=prompt('Bill name',x.name); if(name===null)return; const amt=prompt('Bill amount',x.amt); if(amt===null)return; x.name=name.trim()||x.name; x.amt=amt.trim()||x.amt; save(); renderFinance();}; d.onclick=()=>{state.bills.splice(i,1);save();renderFinance();}; b.appendChild(n);});}
function addFinance(){const i=document.getElementById('finance-input'); const v=i.value.trim(); if(!v) return; state.finance.push({text:v,done:false}); i.value=''; save(); renderFinance();}
function addBill(){const n=document.getElementById('bill-name'); const a=document.getElementById('bill-amt'); if(!n.value.trim()) return; state.bills.push({name:n.value.trim(),amt:a.value.trim()||'$___',paid:false}); n.value=''; a.value=''; save(); renderFinance();}

load(); renderDaily(); renderProjects(); renderFinance();
</script>
</body>
</html>
